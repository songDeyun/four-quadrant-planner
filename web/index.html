<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>四象限计划</title>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--ink:#172033;--muted:#8791a3;--line:#e9edf3;--blue:#387bd0;--blue2:#eaf2ff;--q1:#db6767;--q2:#4e9d7e;--q3:#c99655;--q4:#7b8798;--shadow:0 12px 30px rgba(35,55,85,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1440px;margin:auto;padding:34px 42px 44px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}.brand h1{font-size:32px;letter-spacing:-1px;margin:0 0 7px;font-weight:700}.brand p{margin:0;color:var(--muted);font-size:15px}.stats{background:#edf3fb;color:#5c718b;border-radius:12px;padding:12px 17px;font-size:14px}.stats b{color:#314e70}.nav{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:24px}.nav button{background:none;color:#9aa3b1;padding:13px 4px 14px;font-weight:600;position:relative}.nav button.active{color:var(--ink)}.nav button.active:after{content:"";position:absolute;height:3px;left:0;right:0;bottom:-1px;background:var(--blue);border-radius:3px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card,.panel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}.card{min-height:270px;padding:22px 22px 17px;display:flex;flex-direction:column}.cardhead{display:flex;justify-content:space-between;align-items:flex-start}.card h2{font-size:18px;margin:0 0 5px}.card small{color:var(--muted)}.add{color:#fff;border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px}.q1 h2{color:var(--q1)}.q2 h2{color:var(--q2)}.q3 h2{color:var(--q3)}.q4 h2{color:var(--q4)}.q1 .add{background:var(--q1)}.q2 .add{background:var(--q2)}.q3 .add{background:var(--q3)}.q4 .add{background:var(--q4)}.tasks{margin-top:18px;overflow:auto;flex:1}.empty{text-align:center;color:#b2bac7;padding:64px 5px 20px}.task{display:flex;gap:11px;align-items:flex-start;padding:12px 3px;border-bottom:1px solid #f1f3f6}.task:last-child{border-bottom:0}.check{width:19px;height:19px;border:1.5px solid #cbd3de;border-radius:6px;appearance:none;flex:0 0 auto}.check:checked{background:var(--blue);border-color:var(--blue)}.check:checked:after{content:'✓';color:#fff;display:block;text-align:center;line-height:17px;font-size:13px}.task-text{line-height:1.5;word-break:break-word;flex:1}.task-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s}.task:hover .task-actions{opacity:1}.icon-btn{background:none;color:#9aa5b4;padding:2px 5px;border-radius:6px;font-size:13px}.icon-btn:hover{background:#f0f3f7;color:#4f6077}.panel{padding:24px;margin-bottom:18px}.filters{display:flex;gap:12px;align-items:center}.select{height:42px;border:1px solid #dbe2ec;border-radius:9px;background:#fff;padding:0 13px;color:#46556b;min-width:135px}.primary{margin-left:auto;background:var(--blue);color:#fff;border-radius:9px;padding:12px 20px;font-weight:600}.summary-title{font-size:20px;font-weight:700;margin-bottom:18px}.metric{display:grid;grid-template-columns:18px 1fr 90px 80px;gap:15px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}.dot{width:14px;height:14px;border-radius:4px}.metric .name{font-size:15px}.metric .num{font-size:16px;font-weight:650}.metric .pct{color:#6e7b8d}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th{text-align:left;background:#f5f7fa;color:#6f7b8d;font-weight:600;padding:13px 15px}.table td{padding:16px 15px;border-bottom:1px solid var(--line)}.muted{color:#8791a3}.modal-back{position:fixed;inset:0;background:rgba(23,32,51,.24);display:none;align-items:center;justify-content:center;padding:20px}.modal-back.open{display:flex}.modal{width:min(510px,100%);background:#fff;border-radius:18px;box-shadow:0 25px 70px rgba(16,30,55,.22);padding:26px}.modal h3{margin:0 0 4px;font-size:20px}.modal p{margin:0 0 18px;color:var(--muted)}.modal textarea{width:100%;height:120px;border:1px solid #dbe2ec;border-radius:10px;padding:12px;resize:vertical;outline:0}.modal textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue2)}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.secondary{background:#f2f4f7;color:#617086;border-radius:9px;padding:11px 17px}.modal .primary{margin:0}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:11px 16px;border-radius:9px;display:none}.toast.show{display:block}@media(max-width:820px){.app{padding:24px 18px}.grid{grid-template-columns:1fr}.top{gap:16px;flex-direction:column}.stats{align-self:flex-start}.metric{grid-template-columns:18px 1fr 55px 45px}}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><h1>四象限计划</h1><p>把重要的事，安排在今天</p></div><div class="stats">待完成 <b id="pendingCount">0</b> 项&nbsp; · &nbsp;已完成 <b id="doneCount">0</b> 项</div></header>
<nav class="nav"><button class="active" data-view="plan">我的计划</button><button data-view="history">历史记录</button><button data-view="summary">月度 / 年度汇总</button></nav>
<section id="plan" class="view active"><div class="grid" id="grid"></div></section>
<section id="history" class="view"><div class="panel"><div style="display:flex;align-items:center;gap:10px;margin-bottom:16px"><strong style="font-size:20px">已完成的计划</strong><button class="secondary" style="margin-left:auto" id="undoBtn">撤销完成</button><button class="secondary" id="importBackup">导入备份</button><button class="secondary" id="exportBackup">备份数据</button><button class="primary" style="margin:0" id="exportHistory">导出历史</button></div><div class="table-wrap"><table class="table"><thead><tr><th>计划内容</th><th>所属象限</th><th>开始时间</th><th>完成时间</th><th>操作</th></tr></thead><tbody id="historyBody"></tbody></table></div></div></section>
<section id="summary" class="view"><div class="panel"><div class="filters"><select class="select" id="period"><option value="month">月度</option><option value="year">年度</option></select><select class="select" id="year"></select><select class="select" id="month"></select><button class="primary" id="exportSummary">导出本期数据</button></div></div><div class="panel"><div class="summary-title" id="summaryTitle"></div><div id="metrics"></div></div><div class="panel"><div class="summary-title" style="font-size:17px">本期完成明细</div><div class="table-wrap"><table class="table"><thead><tr><th>计划内容</th><th>所属象限</th><th>开始时间</th><th>完成时间</th></tr></thead><tbody id="summaryBody"></tbody></table></div></div></section>
</main><div class="modal-back" id="modal"><div class="modal"><h3 id="modalTitle">添加计划</h3><p id="modalSub">记录开始时间：现在</p><textarea id="taskInput" placeholder="写下你要完成的事情…"></textarea><div class="modal-actions"><button class="secondary" id="cancel">取消</button><button class="primary" id="save">添加计划</button></div></div></div><input type="file" id="backupFile" accept="application/json" hidden><div class="toast" id="toast"></div>
<script src="data.js"></script><script>
const qs=s=>document.querySelector(s), qsa=s=>[...document.querySelectorAll(s)], colors=['#db6767','#4e9d7e','#c99655','#7b8798'], names=['重要且紧急','重要不紧急','不重要但紧急','不重要不紧急'], subs=['立即行动','提前规划 · 持续成长','适当委派','减少投入'];
let tasks=JSON.parse(localStorage.getItem('quadrantTasks')||'null') || window.initialTasks || [], activeQ=0, editingId=null; if(!localStorage.getItem('quadrantTasks')) localStorage.setItem('quadrantTasks',JSON.stringify(tasks));
const now=()=>new Date().toISOString(), fmt=s=>s?new Date(s).toLocaleString('zh-CN',{hour12:false}).replaceAll('/','-'):'';
function save(){localStorage.setItem('quadrantTasks',JSON.stringify(tasks));render()}
function bindDeleteButtons(){qsa('[data-delete]').forEach(e=>{e.onclick=(event)=>{event.preventDefault();event.stopPropagation();removeTask(e.dataset.delete)}})}function render(){qs('#pendingCount').textContent=tasks.filter(t=>!t.done).length;qs('#doneCount').textContent=tasks.filter(t=>t.done).length;renderPlan();renderHistory();renderSummary();bindDeleteButtons()}
function renderPlan(){qs('#grid').innerHTML=names.map((n,i)=>`<article class="card q${i+1}"><div class="cardhead"><div><h2>${n}</h2><small>${subs[i]}</small></div><button class="add" data-add="${i}">＋ 添加</button></div><div class="tasks">${tasks.filter(t=>t.q===i&&!t.done).map(t=>`<label class="task"><input class="check" type="checkbox" data-done="${t.id}"><span class="task-text" data-edit="${t.id}">${esc(t.title)}</span><span class="task-actions"><button class="icon-btn" data-edit="${t.id}" title="编辑">编辑</button><button class="icon-btn" data-delete="${t.id}" title="删除">删除</button></span></label>`).join('')||'<div class="empty">点击右上角“＋ 添加”安排一项计划</div>'}</div></article>`).join('');qsa('[data-add]').forEach(b=>b.onclick=()=>openModal(+b.dataset.add));qsa('[data-done]').forEach(c=>c.onchange=()=>{const t=tasks.find(x=>x.id===c.dataset.done);t.done=now();save()});qsa('[data-edit]').forEach(e=>e.onclick=()=>openEdit(e.dataset.edit));qsa('[data-delete]').forEach(e=>e.onclick=()=>removeTask(e.dataset.delete))}
function renderHistory(){qs('#historyBody').innerHTML=tasks.filter(t=>t.done).sort((a,b)=>b.done.localeCompare(a.done)).map(t=>`<tr><td>${esc(t.title)}</td><td>${names[t.q]}</td><td class="muted">${fmt(t.started)}</td><td class="muted">${fmt(t.done)}</td><td><button class="icon-btn" data-delete="${t.id}">删除</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">暂无完成记录</td></tr>'}
function renderSummary(){let y=qs('#year').value||new Date().getFullYear(),m=qs('#month').value||String(new Date().getMonth()+1).padStart(2,'0'),yearMode=qs('#period').value==='year';let prefix=String(y)+(yearMode?'':`-${m}`),rows=tasks.filter(t=>t.done&&t.done.startsWith(prefix));qs('#summaryTitle').textContent=`${prefix}  ·  共完成 ${rows.length} 项（按完成时间统计）`;qs('#metrics').innerHTML=names.map((n,i)=>{let c=rows.filter(t=>t.q===i).length,p=rows.length?Math.round(c/rows.length*100):0;return `<div class="metric"><i class="dot" style="background:${colors[i]}"></i><span class="name">${n}</span><span class="num">${c} 项</span><span class="pct">${p}%</span></div>`}).join('');qs('#summaryBody').innerHTML=rows.map(t=>`<tr><td>${esc(t.title)}</td><td>${names[t.q]}</td><td class="muted">${fmt(t.started)}</td><td class="muted">${fmt(t.done)}</td><td><button class="icon-btn" data-delete="${t.id}">删除</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">本期暂无完成记录</td></tr>';bindDeleteButtons()}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openModal(q){activeQ=q;editingId=null;qs('#modalTitle').textContent=`添加到「${names[q]}」`;qs('#taskInput').value='';qs('#modal').classList.add('open');setTimeout(()=>qs('#taskInput').focus(),50)}function closeModal(){qs('#modal').classList.remove('open')}
qs('#cancel').onclick=closeModal;qs('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};qs('#save').onclick=()=>{let title=qs('#taskInput').value.trim();if(!title){show('请先写下计划内容');return}if(editingId){tasks.find(t=>t.id===editingId).title=title}else tasks.push({id:crypto.randomUUID(),title,q:activeQ,started:now(),done:null});closeModal();save()};function openEdit(id){let t=tasks.find(x=>x.id===id);if(!t)return;editingId=id;activeQ=t.q;qs('#modalTitle').textContent='编辑计划';qs('#taskInput').value=t.title;qs('#modal').classList.add('open');setTimeout(()=>qs('#taskInput').focus(),50)}function removeTask(id){let t=tasks.find(x=>x.id===id);if(t&&confirm('确定删除这条计划吗？删除后无法恢复。')){tasks=tasks.filter(x=>x.id!==id);save()}}
qsa('.nav button').forEach(b=>b.onclick=()=>{qsa('.nav button').forEach(x=>x.classList.remove('active'));qsa('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');qs('#'+b.dataset.view).classList.add('active');renderSummary()});
qs('#period').onchange=()=>{qs('#month').disabled=qs('#period').value==='year';renderSummary()};qs('#year').onchange=renderSummary;qs('#month').onchange=renderSummary;let cy=new Date().getFullYear();qs('#year').innerHTML=Array.from({length:11},(_,i)=>`<option>${cy-5+i}</option>`).join('');qs('#year').value=cy;qs('#month').innerHTML=Array.from({length:12},(_,i)=>`<option value="${String(i+1).padStart(2,'0')}">${i+1} 月</option>`).join('');qs('#month').value=String(new Date().getMonth()+1).padStart(2,'0');
qs('#undoBtn').onclick=()=>{let t=tasks.filter(x=>x.done).sort((a,b)=>b.done.localeCompare(a.done))[0];if(t){t.done=null;save()}else show('暂无可撤销的记录')};function show(s){let x=qs('#toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function exportBackup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}));a.download='四象限计划备份.json';a.click()}function importBackup(file){let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!Array.isArray(data)||data.some(t=>!t.title||typeof t.q!=='number'))throw Error();tasks=data;save();show('备份已导入')}catch(e){show('备份文件格式不正确')}};r.readAsText(file)}qs('#exportBackup').onclick=exportBackup;qs('#importBackup').onclick=()=>qs('#backupFile').click();qs('#backupFile').onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=''};function exportCsv(rows){let csv='计划内容,所属象限,开始时间,完成时间\n'+rows.map(t=>`"${t.title.replaceAll('"','""')}","${names[t.q]}","${fmt(t.started)}","${fmt(t.done)}"`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='四象限计划记录.csv';a.click()};qs('#exportHistory').onclick=()=>exportCsv(tasks.filter(t=>t.done));qs('#exportSummary').onclick=()=>{let y=qs('#year').value,m=qs('#month').value,pre=y+(qs('#period').value==='year'?'':`-${m}`);exportCsv(tasks.filter(t=>t.done&&t.done.startsWith(pre)))};
render();
</script></body></html>
